<!DOCTYPE html>
<html lang="en"><head><meta name="ms-sp-authoring-source" content="agent"><style data-sp-site-theme>:root{--colorBrandBackground:#0078d4;--colorBrandBackgroundHover:#106ebe;--colorBrandBackground2:#eff6fc;--colorBrandForeground1:#0078d4;--colorNeutralForeground1:#323130;--colorNeutralForeground2:#605e5c;--colorNeutralForegroundOnBrand:#ffffff;--colorNeutralBackground1:#ffffff;--colorNeutralBackground2:#faf9f8;--colorNeutralStroke1:#d2d0ce;--fontFamily:'Segoe UI', 'Segoe UI Web (West European)', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;}</style><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Band Hub (Demo)</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1f1b16;--mut:#7a7166;--ac:#c2410c;--bd:#e7e0d5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#221e18;--tx:#f3ede4;--mut:#a39a8c;--ac:#fb923c;--bd:#38322a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140f;--card:#221e18;--tx:#f3ede4;--mut:#a39a8c;--ac:#fb923c;--bd:#38322a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:680px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:22px;margin:6px 0 12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0;font-size:13px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.meta{color:var(--mut);font-size:13px}
input,textarea{width:100%;max-width:100%;min-width:0;-webkit-appearance:none;appearance:none;min-height:42px;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin-bottom:8px}
button.pri{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
button.x{background:none;border:0;color:var(--mut);cursor:pointer;float:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.msg{margin-bottom:8px;padding:8px 11px;border-radius:12px;background:var(--card);border:1px solid var(--bd);max-width:85%}
.msg.me{margin-left:auto;background:var(--ac);color:#fff;border-color:var(--ac)}
.msg.me .meta{color:#ffe}
.date{display:inline-block;background:var(--ac);color:#fff;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600;margin-right:6px}
.empty{color:var(--mut);text-align:center;padding:24px}
#note{font-size:12px;color:var(--mut);margin-top:16px}
</style></head><body>
<main><h1>🎺 Band Hub</h1><div id="v"></div><div id="note"></div></main>
<nav id="nav"></nav>
<script>
/* Demo mode: stands in for Claude's hosted storage. Data lives only in this browser. */
(function(){
const P="bandhub-demo:",subs={},memory={};
const get=k=>{try{const v=window.localStorage.getItem(k);return v===null?(memory[k]??null):v}catch(e){return memory[k]??null}};
const put=(k,v)=>{memory[k]=String(v);try{window.localStorage.setItem(k,v)}catch(e){}};
const load=n=>{try{return JSON.parse(get(P+n)||"{}")}catch(e){return{}}};
const save=(n,o)=>{put(P+n,JSON.stringify(o))};
const snap=n=>{const o=load(n);return{docs:Object.keys(o).map(id=>({id,data:()=>o[id]}))}};
const fire=n=>(subs[n]||[]).forEach(f=>f(snap(n)));
const db={collection:n=>({
 doc:id=>({set:async d=>{const o=load(n);o[id]=d;save(n,o);fire(n)},delete:async()=>{const o=load(n);delete o[id];save(n,o);fire(n)}}),
 onSnapshot:(f)=>{(subs[n]=subs[n]||[]).push(f);setTimeout(()=>f(snap(n)),0);return()=>{}}})};
const user={id:async()=>"me",canEdit:()=>true,profiles:async ids=>Object.fromEntries(ids.map(i=>[i,{name:i==="me"?"You":i}]))};
const assets={upload:file=>new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const s=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const u=c.toDataURL("image/jpeg",.7);res({id:"a"+Date.now(),url:u})};im.src=r.result};r.readAsDataURL(file)})};
window.claude={use:async n=>({db,user,assets})[n]||null};
if(!get(P+"seeded")){const d=864e5,t=Date.now();
 save("events",{e1:{title:"Rehearsal",when:t+2*d,where:"Band room",by:"me"},e2:{title:"Fall Concert",when:t+9*d,where:"Auditorium, 7pm",by:"me"}});
 save("posts",{p1:{text:"Welcome to Band Hub! Sample post: bring your music folders Thursday.",ts:t-d,by:"me"}});
 save("messages",{m1:{text:"Who can carpool on Saturday?",ts:t-36e5,by:"me"}});
 put(P+"seeded","1")}
})();
</script>
<script>
const TABS=[["cal","📅","Calendar"],["posts","📣","Posts"],["photos","📷","Photos"],["chat","💬","Chat"]];
let tab="cal",db=null,user=null,assets=null,me=null,canEdit=false;
const S={cal:[],posts:[],photos:[],chat:[]},names={};
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const col=n=>({cal:"events",posts:"posts",photos:"photos",chat:"messages"})[n];
const nm=id=>names[id]||"Someone";
const fmt=t=>new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
function nav(){const n=$("#nav");n.textContent="";TABS.forEach(([k,i,l])=>{const b=el("button",k===tab?"on":"",i+" "+l);b.onclick=()=>{tab=k;nav();draw()};n.append(b)})}
async function resolve(){if(!user)return;const ids=[...new Set(Object.values(S).flat().map(d=>d.by).filter(Boolean))];try{const p=await user.profiles(ids);ids.forEach(i=>names[i]=(p[i]&&p[i].name)||"")}catch(e){}}
function del(c,d){if(!db||!(canEdit||d.by===me))return null;const b=el("button","x","✕");b.title="Delete";b.onclick=()=>{if(confirm("Delete this?"))db.collection(col(c)).doc(d.id).delete().catch(()=>{})};return b}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function draw(){
 const v=$("#v");v.textContent="";const L=S[tab];
 if(!db){v.append(el("div","empty","Sign in to claude.ai to see and add band updates."));return}
 if(tab==="cal"){
  if(canEdit){const c=el("div","card"),t=el("input");t.placeholder="Event (e.g. Rehearsal, Concert)";const d=el("input");d.type="datetime-local";const w=el("input");w.placeholder="Where / notes (optional)";const b=el("button","pri","Add event");
   b.onclick=()=>{if(!t.value||!d.value)return;db.collection("events").doc(uid()).set({title:t.value,when:new Date(d.value).getTime(),where:w.value,by:me}).catch(()=>{})};c.append(t,d,w,b);v.append(c)}
  const up=[...L].sort((a,b)=>a.when-b.when);
  if(!up.length)v.append(el("div","empty","No events yet."+(canEdit?"":" Directors/admins can add them.")));
  up.forEach(e=>{const c=el("div","card"),x=del("cal",e);if(x)c.append(x);c.append(el("span","date",fmt(e.when)),el("strong","",e.title));if(e.where)c.append(el("div","meta",e.where));v.append(c)})
 }
 if(tab==="posts"||tab==="chat"){
  const chat=tab==="chat",c=el("div","card"),t=el("textarea");t.rows=chat?2:3;t.placeholder=chat?"Message everyone…":"Share an announcement or update…";const b=el("button","pri",chat?"Send":"Post");
  b.onclick=()=>{const s=t.value.trim();if(!s)return;t.value="";db.collection(col(tab)).doc(uid()).set({text:s,ts:Date.now(),by:me}).catch(()=>{})};c.append(t,b);
  if(chat){const list=el("div");[...L].sort((a,b)=>a.ts-b.ts).forEach(m=>{const e=el("div","msg"+(m.by===me?" me":""));e.append(el("div","meta",nm(m.by)+" · "+fmt(m.ts)),el("div","",m.text));const x=del("chat",m);if(x)e.append(x);list.append(e)});if(!L.length)list.append(el("div","empty","No messages yet."));v.append(list,c)}
  else{v.append(c);if(!L.length)v.append(el("div","empty","No posts yet."));[...L].sort((a,b)=>b.ts-a.ts).forEach(p=>{const e=el("div","card"),x=del("posts",p);if(x)e.append(x);e.append(el("div","meta",nm(p.by)+" · "+fmt(p.ts)),el("div","",p.text));v.append(e)})}
 }
 if(tab==="photos"){
  if(assets){const f=el("input");f.type="file";f.accept="image/*";f.multiple=true;const b=el("div","meta","Add photos:");f.onchange=async()=>{b.textContent="Uploading…";for(const file of f.files){try{const r=await assets.upload(file);await db.collection("photos").doc(uid()).set({aid:r.id,url:r.url,ts:Date.now(),by:me})}catch(e){b.textContent="Upload failed: "+(e.message||e.code);return}}b.textContent="Add photos:"};const c=el("div","card");c.append(b,f);v.append(c)}
  else v.append(el("div","meta","Photo uploads aren't enabled for your account."));
  const g=el("div","grid");[...L].sort((a,b)=>b.ts-a.ts).forEach(p=>{const w=el("div"),i=el("img");i.src=p.url;i.loading="lazy";i.alt="Band photo";i.onclick=()=>window.open(p.url,"_blank");w.append(i);const x=del("photos",p);if(x)w.append(x);g.append(w)});
  if(!L.length)v.append(el("div","empty","No photos yet."));else v.append(g)
 }
}
async function init(){
 nav();draw();
 try{user=await claude.use("user");db=await claude.use("db");assets=await claude.use("assets")}catch(e){}
 if(!db||!user){draw();return}
 try{me=await user.id();canEdit=user.canEdit()}catch(e){}
 for(const k of Object.keys(S)){db.collection(col(k)).onSnapshot(async s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));await resolve();draw()},()=>{})}
 $("#note").textContent="DEMO: everything you add is saved only on this device and browser, so nobody else sees it.";
 draw();
}
init();
</script></body></html>
